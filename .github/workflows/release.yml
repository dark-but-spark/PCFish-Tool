name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: publish GitHub release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack
        shell: pwsh
        run: ./scripts/pack-release.ps1

      - name: Verify
        shell: pwsh
        run: |
          $v = (Get-Content ./VERSION -Raw).Trim()
          $zip = "dist/PCFish-Tool-v$v.zip"
          if (-not (Test-Path $zip)) { throw "Missing: $zip" }
          Get-Content "dist/SHA256SUMS.txt"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          body_path: ./RELEASE_NOTES.md
          draft: false
          prerelease: false
