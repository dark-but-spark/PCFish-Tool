name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: pack zip + installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install frida pyinstaller

      - name: Pack zip
        shell: pwsh
        run: ./scripts/pack-release.ps1

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Verify
        shell: pwsh
        run: |
          $v = (Get-Content ./VERSION -Raw).Trim()
          $zip = "dist/PCFish-Tool-v$v.zip"
          $setup = "dist/PCFishTool-Setup-v$v.exe"
          if (-not (Test-Path $zip)) { throw "Missing: $zip" }
          if (-not (Test-Path $setup)) { throw "Missing: $setup" }
          Get-Item $zip, $setup, "dist/SHA256SUMS.txt" | Format-List FullName, Length
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCFish-Tool
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
